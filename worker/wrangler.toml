name = "inceptez-forum-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The OAuth Client ID is not secret (it's already public in assets/auth.js),
# so it's fine as a plain var here.
[vars]
GITHUB_OAUTH_CLIENT_ID = "Ov23liAgv7WXEm2yjRyw"

# Set these as secrets, never in this file:
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put GITHUB_OAUTH_CLIENT_SECRET
#   wrangler secret put SESSION_SECRET

# Holds the hidden hackathon answer keys (data/projects/*-leaderboard scoring) and
# per-user submission counters/best scores. Never readable from the public GitHub repo.
# One-time setup:
#   npx wrangler kv namespace create SUBMISSIONS_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "SUBMISSIONS_KV"
id = "e27ef0bdeb42493c825dbab50b35117a"
